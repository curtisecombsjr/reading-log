<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5046e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book shape -->
  <g transform="translate(256, 256)">
    <!-- Book body -->
    <path d="M-120 -100 L-120 100 Q-120 120 -100 120 L100 120 Q120 120 120 100 L120 -100 Q120 -120 100 -120 L-100 -120 Q-120 -120 -120 -100 Z" fill="#fff" opacity="0.95"/>
    <!-- Book spine -->
    <rect x="-130" y="-110" width="25" height="220" rx="4" fill="#e0e0e0"/>
    <!-- Page lines -->
    <line x1="-80" y1="-70" x2="90" y2="-70" stroke="#5046e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <line x1="-80" y1="-30" x2="90" y2="-30" stroke="#5046e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <line x1="-80" y1="10" x2="60" y2="10" stroke="#5046e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <line x1="-80" y1="50" x2="75" y2="50" stroke="#5046e5" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
    <!-- Bookmark -->
    <path d="M60 -120 L60 -40 L80 -60 L100 -40 L100 -120 Z" fill="#f59e0b"/>
  </g>
</svg>
